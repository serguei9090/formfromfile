# Internal deployment — app + Caddy (auto-TLS) + a named data volume.
# Copy .env.example to .env, set DOMAIN + ACME_EMAIL, then: docker compose up -d
#
# For a zero-open-port setup (Cloudflare Tunnel + Access), see docs/DEPLOY.md
# §2b and drop the caddy service.

services:
  app:
    build: .
    image: formfromfile:local
    restart: unless-stopped
    environment:
      FFF_ADDR: 0.0.0.0:8787
      # SQLite by default. To use the optional `db` service below, set
      # FFF_DATABASE_URL in .env (or FFF_DATABASE_URL_FILE for a secret).
      FFF_DB: /data/formfromfile.db
      FFF_DATABASE_URL: "${FFF_DATABASE_URL:-}"
      # set false once your admin account exists, then create users from /admin
      FFF_ALLOW_REGISTER: "${FFF_ALLOW_REGISTER:-true}"
      # honour X-Forwarded-For — Caddy sets it, and nothing else can reach :8787
      FFF_TRUST_PROXY: "true"
      FFF_LOG_FORMAT: json
      # optional — internal webhook targets on the LAN
      FFF_WEBHOOK_ALLOW_PRIVATE: "${FFF_WEBHOOK_ALLOW_PRIVATE:-false}"
      # optional — public-form spam control (free; keys from the Turnstile dashboard)
      FFF_TURNSTILE_SITE_KEY: "${FFF_TURNSTILE_SITE_KEY:-}"
      FFF_TURNSTILE_SECRET: "${FFF_TURNSTILE_SECRET:-}"
      # optional — AI beta (needs BOTH)
      FFF_ANTHROPIC_API_KEY: "${FFF_ANTHROPIC_API_KEY:-}"
      FFF_AI_BETA: "${FFF_AI_BETA:-}"
      # optional — Google sign-in via Firebase (see docs/AUTH.md)
      FFF_FIREBASE_PROJECT_ID: "${FFF_FIREBASE_PROJECT_ID:-}"
      FFF_FIREBASE_API_KEY: "${FFF_FIREBASE_API_KEY:-}"
      FFF_FIREBASE_AUTH_DOMAIN: "${FFF_FIREBASE_AUTH_DOMAIN:-}"
      FFF_FIREBASE_APP_ID: "${FFF_FIREBASE_APP_ID:-}"
    volumes:
      - fff-data:/data
    # no host ports — only Caddy talks to the app, over the compose network
    # depends_on: [db]   # uncomment if you enable the db service below

  # Optional Postgres. Uncomment this service, uncomment app.depends_on above,
  # and set in .env:
  #   FFF_DATABASE_URL=postgres://fff:CHANGE_ME@db:5432/fff?sslmode=disable
  # (sslmode=disable is fine here — the connection never leaves the compose
  # network. Use require/verify-full for an external Postgres.)
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: fff
  #     POSTGRES_PASSWORD: CHANGE_ME       # match FFF_DATABASE_URL
  #     POSTGRES_DB: fff
  #   volumes:
  #     - fff-pg:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U fff"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  fff-data:
  # fff-pg:        # uncomment with the db service
  caddy-data:
  caddy-config:
