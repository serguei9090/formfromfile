name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run build   # tsc -b (typecheck) + vite build
      - run: bun run test
      - run: bun run lint

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: server
      # non-blocking for now (stdlib advisories often just need the next Go
      # patch — the setup-go "1.26" line tracks it). Flip continue-on-error
      # off once we're confident it stays green.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  e2e:
    runs-on: ubuntu-latest
    needs: [web, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install web deps
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: web
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [web, server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: formfromfile:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        continue-on-error: true # non-blocking for now; see govulncheck note
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: formfromfile:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Smoke test
        run: |
          docker run -d --name fff -p 8787:8787 formfromfile:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/healthz && break
            sleep 1
          done
          echo "--- healthz ---"
          curl -fsS http://localhost:8787/healthz | grep '"ok":true'
          echo "--- config ---"
          curl -fsS http://localhost:8787/api/config | grep '"allowRegister":true'
          echo "--- SPA is embedded ---"
          curl -fsS http://localhost:8787/ | grep -qi '<title>' \
            && echo "SPA served" || (echo "SPA missing" && exit 1)
          echo "--- register (first user = admin) ---"
          curl -fsS -X POST http://localhost:8787/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' | grep '"role":"admin"'
      - name: Container logs
        if: always()
        run: docker logs fff || true
      - name: Cleanup
        if: always()
        run: docker rm -f fff || true
