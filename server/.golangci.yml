version: "2"

linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - std-error-handling # unchecked Close()/Write() on defer, etc.
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
